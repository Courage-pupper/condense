name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # the release workflow runs the same tests first

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub's runners have no GPU: these cover everything except the GPU code paths.
        # windows-latest is added once the Windows platform layer exists.
        os: [macos-latest, ubuntu-latest]  # macos-latest = Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Condense (without GPU extras)
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Check the install scripts
        run: |
          bash -n install.sh
          bash -n scripts/install-mac.sh
          bash -n scripts/install-linux.sh
          ./scripts/install-linux.sh --help > /dev/null
