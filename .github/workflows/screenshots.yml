name: user-guide screenshots

# Run by hand (Actions ▸ user-guide screenshots ▸ Run workflow) after the interface changes. Takes the pictures in
# docs/images/ from the real app on a virtual display, with invented demo data only, and commits them if they changed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ffmpeg, Xvfb, ImageMagick
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb imagemagick fonts-dejavu
      - name: Install Condense
        run: python -m pip install -e .
      - name: Take the screenshots
        env:
          CONDENSE_SCREENSHOTS: ${{ github.workspace }}/docs/images
          CONDENSE_WORK: ${{ runner.temp }}/work
          PYTHONPATH: tests/realtk
        run: |
          export HOME="${{ runner.temp }}/home"; mkdir -p "$HOME"
          xvfb-run -a -s "-screen 0 1600x1000x24" python tests/realtk/smoke.py
      - name: Commit them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Update user-guide screenshots"
          git push
