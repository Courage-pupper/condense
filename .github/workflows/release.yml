name: release

# Publish a release in either way:
#   - push a tag:  git tag -a v0.10.0 -m "Condense 0.10.0" && git push origin v0.10.0
#   - or on GitHub: Releases > Draft a new release > new tag v0.10.0 on main > Publish
# The tag must match condense.__version__ and have a "## 0.10.0" section in CHANGELOG.md. This workflow runs the
# tests, then fills in the release: notes from the changelog and the built package files.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}   # a release made on GitHub also creates the tag: handle it once at a time

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/condense/__init__.py').read()).group(1))")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match condense.__version__ $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1
          fi
          cat >> notes.md <<'NOTES'

          ---
          **Install:** download *Source code* below, unpack it, and run `./scripts/install-mac.sh` (macOS) or `./scripts/install-linux.sh` (Linux) in the folder. Guides: [Mac](https://github.com/Courage-pupper/condense/blob/main/docs/install-mac.md) · [Linux](https://github.com/Courage-pupper/condense/blob/main/docs/install-linux.md).
          NOTES

      - name: Build the Python package
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PRE=""
          case "$VERSION" in *a*|*b*|*rc*) PRE="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # made on GitHub's website (or by an earlier run): fill in notes and files
            gh release edit "$GITHUB_REF_NAME" --title "Condense $VERSION" --notes-file notes.md $PRE
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Condense $VERSION" --notes-file notes.md --verify-tag $PRE
          fi
