[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "condense"
dynamic = ["version"]
description = "Local video, audio and transcript processing for qualitative research: merge, compress, transcribe, check and export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "s-hurtado26" }]
keywords = ["qualitative research", "transcription", "whisper", "speaker diarization", "interviews"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering",
]
# openpyxl + Pillow: the commentary spreadsheet with video frames (Pillow is what openpyxl needs for pictures)
dependencies = ["numpy", "openpyxl>=3.1", "Pillow>=10"]

[project.urls]
Homepage = "https://github.com/s-hurtado26/condense"
Issues = "https://github.com/s-hurtado26/condense/issues"
Changelog = "https://github.com/s-hurtado26/condense/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Apple Silicon: Whisper on the GPU via MLX, PyTorch (Metal) for speaker detection, openai-whisper as CPU fallback.
mac = ["mlx-whisper", "openai-whisper", "torch"]
# Linux: openai-whisper on the GPU through PyTorch. Install the ROCm (AMD) or CUDA (NVIDIA) build of torch first —
# scripts/install-linux.sh does this — because PyPI's default torch for Linux is a CUDA build.
linux = ["openai-whisper", "torch"]
# Windows: the same. install-windows.ps1 installs the CUDA (NVIDIA) or AMD ROCm-for-Windows build of torch first.
windows = ["openai-whisper", "torch"]
# Optional neural speaker detection (needs a Hugging Face token).
pyannote = ["pyannote.audio"]
dev = ["pytest"]

[project.scripts]
condense = "condense.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "condense.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
